<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SmartCalc Manager</title>
<style>
  :root{font-family:system-ui,Segoe UI,Arial;direction:rtl}
  body{margin:0;background:#f5f7fb;color:#0b1220;padding:18px}
  .app{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .card{background:#fff;border-radius:10px;padding:12px;box-shadow:0 6px 18px rgba(10,10,20,.06)}
  .display{background:#0b1220;color:#fff;padding:10px;border-radius:8px;min-height:58px;display:flex;flex-direction:column;justify-content:center}
  .expr{font-size:13px;opacity:.8;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .res{font-size:22px;font-weight:700}
  .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  button{height:48px;border-radius:8px;border:0;cursor:pointer}
  .num{background:#eef2f6}
  .op{background:#2563eb;color:#fff}
  .clear{background:#ef4444;color:#fff}
  .wide{grid-column:span 2}
  /* history */
  .history-header{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .search{flex:1;padding:8px;border-radius:8px;border:1px solid #e3e7ef}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px;border-bottom:1px solid #f0f3f7;text-align:right;font-size:14px}
  .small{font-size:12px;padding:6px 8px}
  @media(max-width:800px){.app{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <h2 style="text-align:center">SmartCalc Manager</h2>
  <div class="app">
    <!-- Calculator Card -->
    <div class="card">
      <div class="display" aria-live="polite">
        <div class="expr" id="expr">&nbsp;</div>
        <div class="res" id="res">0</div>
      </div>
      <div class="keys" id="keys">
        <button class="clear small" data-action="all-clear">AC</button>
        <button class="small" data-action="back">⌫</button>
        <button class="small" data-value="%" data-action="percent">%</button>
        <button class="op" data-value="/" title="divide">÷</button>

        <button class="num" data-value="7">7</button>
        <button class="num" data-value="8">8</button>
        <button class="num" data-value="9">9</button>
        <button class="op" data-value="*" title="multiply">×</button>

        <button class="num" data-value="4">4</button>
        <button class="num" data-value="5">5</button>
        <button class="num" data-value="6">6</button>
        <button class="op" data-value="-" title="subtract">−</button>

        <button class="num" data-value="1">1</button>
        <button class="num" data-value="2">2</button>
        <button class="num" data-value="3">3</button>
        <button class="op" data-value="+" title="add">+</button>

        <button class="num wide" data-value="0">0</button>
        <button class="num" data-value=".">.</button>
        <button class="op" data-action="equals" style="background:#10b981;color:#fff">=</button>
      </div>
    </div>

    <!-- History / CRUD Card -->
    <div class="card">
      <div class="history-header">
        <input id="search" class="search" placeholder="ابحث عن عملية (تعبير أو نتيجة أو تاج)" />
        <button id="export" class="small">Export CSV</button>
        <button id="clearAll" class="small" style="background:#ef4444;color:#fff">مسح الكل</button>
      </div>

      <table id="historyTable">
        <thead>
          <tr><th>التعبير</th><th>النتيجة</th><th>الوقت</th><th>تاج</th><th>أوامر</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>

<script>
(function(){
  // Helpers
  const exprEl = document.getElementById('expr');
  const resEl = document.getElementById('res');
  const keys = document.getElementById('keys');
  const historyBody = document.getElementById('historyBody');
  const searchInput = document.getElementById('search');
  const exportBtn = document.getElementById('export');
  const clearAllBtn = document.getElementById('clearAll');

  const LS_KEY = 'smartcalc_history_v1';
  let expression = '';
  let lastEval = null;
  let history = loadHistory(); // array of ops

  function loadHistory(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveHistory(){ localStorage.setItem(LS_KEY, JSON.stringify(history)); }

  function id(){ return 'op_' + Date.now() + '_' + Math.floor(Math.random()*1000); }

  function render(){
    exprEl.textContent = expression || '\u00A0';
    resEl.textContent = (lastEval !== null) ? String(lastEval) : '0';
    renderHistory();
  }

  function safeEvaluate(exp){
    try{
      if(!exp) return null;
      if(/[^\d+\-*/().% ]/.test(exp)) return null;
      const normalized = exp.replace(/×/g,'*').replace(/÷/g,'/').replace(/%/g,'/100');
      const fn = new Function('return ' + normalized);
      const val = fn();
      if(typeof val === 'number' && isFinite(val)) return Math.round((val + Number.EPSILON) * 1e12) / 1e12;
      return null;
    }catch(e){ return null; }
  }

  // History rendering + filtering
  function renderHistory(filter=''){
    historyBody.innerHTML = '';
    const q = filter.trim().toLowerCase();
    const list = history.slice().reverse(); // newest first
    for(const op of list){
      if(q){
        const hay = (op.expression + ' ' + op.result + ' ' + (op.tags||[]).join(' ')).toLowerCase();
        if(!hay.includes(q)) continue;
      }
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${escapeHtml(op.expression)}</td>
        <td>${escapeHtml(String(op.result))}</td>
        <td style="white-space:nowrap">${new Date(op.timestamp).toLocaleString()}</td>
        <td>${(op.tags||[]).map(t=>'<span style="background:#eef; padding:2px 6px;border-radius:6px;margin-left:4px;font-size:12px">'+escapeHtml(t)+'</span>').join('')}</td>
        <td>
          <button class="small" data-action="view" data-id="${op.id}">عرض</button>
          <button class="small" data-action="edit" data-id="${op.id}">تعديل</button>
          <button class="small" data-action="delete" data-id="${op.id}" style="background:#ef4444;color:#fff">حذف</button>
        </td>
      `;
      historyBody.appendChild(tr);
    }
  }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // Key handling (buttons)
  keys.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const val = btn.dataset.value;
    const action = btn.dataset.action;

    if(action === 'all-clear'){ expression=''; lastEval=null; render(); return; }
    if(action === 'back'){ expression = expression.slice(0,-1); lastEval = safeEvaluate(expression); render(); return; }
    if(action === 'equals'){
      const v = safeEvaluate(expression);
      if(v === null){ resEl.textContent = 'Error'; return; }
      lastEval = v;
      // save to history
      const op = { id: id(), expression: expression, result: v, timestamp: Date.now(), tags: [] };
      history.push(op); saveHistory(); expression = String(v); render(); return;
    }
    if(action === 'percent'){ expression += '%'; }
    else if(val !== undefined){ expression += val; }
    lastEval = safeEvaluate(expression);
    render();
  });

  // keyboard support
  window.addEventListener('keydown', (e) => {
    const allowed = '0123456789+-*/().%';
    if(e.key === 'Enter' || e.key === '='){ e.preventDefault(); document.querySelector('[data-action="equals"]').click(); return; }
    if(e.key === 'Backspace'){ expression = expression.slice(0,-1); lastEval = safeEvaluate(expression); render(); return; }
    if(e.key === 'Escape'){ expression=''; lastEval=null; render(); return; }
    if(allowed.includes(e.key)){ expression += e.key; lastEval = safeEvaluate(expression); render(); }
  });

  // history actions (delegation)
  historyBody.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    const action = btn.dataset.action;
    const opId = btn.dataset.id;
    if(action === 'view'){
      const op = history.find(x=>x.id===opId);
      if(!op) return alert('غير موجود');
      alert('Expression: ' + op.expression + '\nResult: ' + op.result + '\nTime: ' + new Date(op.timestamp).toLocaleString());
    } else if(action === 'delete'){
      if(!confirm('متأكد تمسح العملية؟')) return;
      history = history.filter(x=>x.id !== opId); saveHistory(); render();
    } else if(action === 'edit'){
      const opIndex = history.findIndex(x=>x.id===opId);
      if(opIndex === -1) return;
      const op = history[opIndex];
      const newExpr = prompt('عدل التعبير:', op.expression);
      if(newExpr === null) return;
      const newRes = safeEvaluate(newExpr);
      if(newRes === null){ alert('التعبير غير صحيح'); return; }
      history[opIndex].expression = newExpr;
      history[opIndex].result = newRes;
      history[opIndex].timestamp = Date.now();
      saveHistory(); render();
    }
  });

  // search
  searchInput.addEventListener('input', (e)=> renderHistory(e.target.value));

  // clear all
  clearAllBtn.addEventListener('click', ()=> {
    if(!confirm('مسح كل التاريخ؟')) return;
    history = []; saveHistory(); render();
  });

  // export CSV
  exportBtn.addEventListener('click', ()=> {
    if(!history.length){ alert('لا يوجد بيانات للتصدير'); return; }
    const rows = [['expression','result','timestamp']];
    for(const op of history){
      rows.push([op.expression, String(op.result), new Date(op.timestamp).toISOString()]);
    }
    const csv = rows.map(r => r.map(cell => '"' + String(cell).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'smartcalc_history.csv'; a.click(); URL.revokeObjectURL(url);
  });

  // initial render
  render();
})();
</script>
</body>
</html>
